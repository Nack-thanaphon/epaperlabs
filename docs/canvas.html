<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>E-PaperLabs</title>
<style>
  :root {
    --bg: #f6f7f9;
    --paper: #ffffff;
    --ink: #1a1a2e;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --danger: #dc2626;
    --danger-hover: #b91c1c;
    --muted: #6b7280;
    --border: #e5e7eb;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    position: fixed;
    inset: 0;
    overscroll-behavior: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
  }

  .container {
    display: flex;
    flex-direction: column;
    width: 100%; height: 100%;
    background: var(--paper);
    border-radius: 12px;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
  }

  /* ── Canvas area ── */
  .canvas-wrap {
    flex: 1;
    position: relative;
    background: var(--paper);
    /* critical: prevents scroll/zoom interference during drawing on touch devices */
    touch-action: none;
    overflow: hidden;
    min-height: 200px;
  }

  #canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    cursor: crosshair;
    display: block;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  .placeholder {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: var(--muted);
    font-size: 15px;
    pointer-events: none;
    text-align: center;
    transition: opacity .2s;
  }

  .placeholder.hidden { opacity: 0; }

  /* ── Toolbar ── */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: var(--paper);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    background: var(--paper);
    color: var(--ink);
    transition: background .15s, border-color .15s;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .btn:hover { background: #f0f0f5; }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .4; cursor: default; }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .btn-primary:hover { background: var(--accent-hover); }

  .btn-danger { color: var(--danger); }
  .btn-danger:hover { background: #fef2f2; }

  .spacer { flex: 1; }

  .label {
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: .02em;
  }

  .status {
    font-size: 12px;
    color: var(--muted);
    min-height: 16px;
  }

  /* ── Loading overlay ── */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,.9);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    transition: opacity .2s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 24px; height: 24px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container">
  <!-- Drawing surface -->
  <div class="canvas-wrap" id="canvas-wrap">
    <canvas id="canvas"></canvas>
    <div class="placeholder" id="placeholder">✏️ Write or draw here</div>
    <div class="overlay hidden" id="overlay">
      <div class="spinner"></div>
    </div>
  </div>

  <!-- Controls -->
  <div class="toolbar">
    <span class="label">E-PaperLabs</span>
    <div class="spacer"></div>
    <button class="btn" id="btn-zoom-out" title="Zoom out">−</button>
    <button class="btn" id="btn-zoom-reset" title="Reset zoom">100%</button>
    <button class="btn" id="btn-zoom-in" title="Zoom in">＋</button>
    <button class="btn" id="btn-undo" title="Undo last stroke">↶ Undo</button>
    <button class="btn btn-danger" id="btn-clear" title="Clear all">Clear</button>
    <button class="btn btn-primary" id="btn-submit" title="Submit handwriting to ChatGPT">Submit</button>
  </div>
</div>

<script type="module">
// ═══════════════════════════════════════════════════════════════════════════════
// E-PaperLabs Canvas Widget
// ═══════════════════════════════════════════════════════════════════════════════
//
// Architecture (per official OpenAI Apps SDK / MCP Apps docs):
//
//   1. JSON-RPC bridge over postMessage connects us to the ChatGPT host.
//   2. On Submit:
//      a. Render strokes → offscreen canvas → toBlob → File
//      b. window.openai.uploadFile(file) → fileId
//      c. window.openai.setWidgetState({ imageIds: [fileId], modelContent: ... })
//      d. window.openai.sendFollowUpMessage({ prompt: ... })
//   3. ChatGPT sees the image via fileId and continues the SAME conversation.
//
// Fallback (if window.openai is unavailable — e.g., testing in plain browser):
//   The strokes JSON + data URL are offered as a download.
// ═══════════════════════════════════════════════════════════════════════════════

const canvas    = document.getElementById('canvas');
const ctx       = canvas.getContext('2d');
const wrap      = document.getElementById('canvas-wrap');
const placeholder = document.getElementById('placeholder');
const overlay   = document.getElementById('overlay');

const btnUndo   = document.getElementById('btn-undo');
const btnClear  = document.getElementById('btn-clear');
const btnSubmit = document.getElementById('btn-submit');
const btnZoomOut = document.getElementById('btn-zoom-out');
const btnZoomReset = document.getElementById('btn-zoom-reset');
const btnZoomIn = document.getElementById('btn-zoom-in');

// ── Stroke state ──
let strokes = [];        // Array<Array<{x, y, pressure}>>
let currentStroke = null;
let isDrawing = false;
let dpr = window.devicePixelRatio || 1;

// ── Board viewport state ──
// Strokes are stored in "paper coordinates". viewportScale/offset only affect
// how the paper is viewed, so users can pinch-zoom/pan like GoodNotes without
// corrupting the handwritten geometry.
let viewportScale = 1;
let viewportOffset = { x: 0, y: 0 };
const activePointers = new Map();
let pinchStart = null;

// ── High-DPI canvas setup ───────────────────────────────────────────────
function resizeCanvas() {
  const rect = wrap.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  canvas.width  = Math.round(rect.width  * dpr);
  canvas.height = Math.round(rect.height * dpr);
  applyViewportTransform();
  redraw();
}

window.addEventListener('resize', resizeCanvas);

// ResizeObserver handles responsive resizing inside the iframe
const ro = new ResizeObserver(resizeCanvas);
ro.observe(wrap);

// Initial size after layout
requestAnimationFrame(resizeCanvas);

// ── Drawing ─────────────────────────────────────────────────────────────
function getPoint(e) {
  const rect = canvas.getBoundingClientRect();
  const screenX = e.clientX - rect.left;
  const screenY = e.clientY - rect.top;
  return {
    x: (screenX - viewportOffset.x) / viewportScale,
    y: (screenY - viewportOffset.y) / viewportScale,
    pressure: (e.pressure !== undefined && e.pressure > 0 && e.pressure !== 0.5)
      ? e.pressure
      : 0.5, // default for mouse / non-pressure touch
  };
}

function pointerScreenPoint(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

function distance(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function midpoint(a, b) {
  return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
}

function startPinch() {
  const pts = [...activePointers.values()];
  if (pts.length < 2) return;
  const a = pointerScreenPoint(pts[0]);
  const b = pointerScreenPoint(pts[1]);
  pinchStart = {
    distance: Math.max(1, distance(a, b)),
    center: midpoint(a, b),
    scale: viewportScale,
    offset: { ...viewportOffset },
  };
  if (isDrawing && currentStroke?.length < 2) strokes.pop();
  isDrawing = false;
  currentStroke = null;
  redraw();
}

function updatePinch() {
  const pts = [...activePointers.values()];
  if (!pinchStart || pts.length < 2) return;
  const a = pointerScreenPoint(pts[0]);
  const b = pointerScreenPoint(pts[1]);
  const center = midpoint(a, b);
  const nextScale = Math.max(0.5, Math.min(4, pinchStart.scale * distance(a, b) / pinchStart.distance));
  const paperX = (pinchStart.center.x - pinchStart.offset.x) / pinchStart.scale;
  const paperY = (pinchStart.center.y - pinchStart.offset.y) / pinchStart.scale;
  viewportScale = nextScale;
  viewportOffset.x = center.x - paperX * viewportScale;
  viewportOffset.y = center.y - paperY * viewportScale;
  btnZoomReset.textContent = `${Math.round(viewportScale * 100)}%`;
  redraw();
}

function startStroke(e) {
  e.preventDefault();
  e.stopPropagation();
  try { canvas.setPointerCapture(e.pointerId); } catch {}
  activePointers.set(e.pointerId, e);
  if (activePointers.size >= 2) {
    startPinch();
    return;
  }
  isDrawing = true;
  currentStroke = [];
  const pt = getPoint(e);
  currentStroke.push(pt);
  strokes.push(currentStroke);
  placeholder.classList.add('hidden');
  // Draw initial dot
  drawDot(pt.x, pt.y, pressureToWidth(pt.pressure));
}

function continueStroke(e) {
  activePointers.set(e.pointerId, e);
  if (activePointers.size >= 2) {
    e.preventDefault();
    e.stopPropagation();
    updatePinch();
    return;
  }
  if (!isDrawing) return;
  e.preventDefault();
  e.stopPropagation();
  const pt = getPoint(e);
  const prev = currentStroke[currentStroke.length - 1];
  currentStroke.push(pt);
  drawSegment(prev, pt);
}

function endStroke(e) {
  activePointers.delete(e.pointerId);
  if (activePointers.size < 2) pinchStart = null;
  if (!isDrawing) return;
  e.preventDefault?.();
  e.stopPropagation?.();
  try { canvas.releasePointerCapture(e.pointerId); } catch {}
  isDrawing = false;
  currentStroke = null;
  // Prevent accidental cancellation from leaving partial state
}

function cancelStroke(e) {
  if (e?.pointerId !== undefined) activePointers.delete(e.pointerId);
  if (activePointers.size < 2) pinchStart = null;
  if (!isDrawing) return;
  isDrawing = false;
  // Remove incomplete stroke on cancellation (e.g., palm rejection)
  if (currentStroke && currentStroke.length < 2) {
    strokes.pop();
  }
  currentStroke = null;
  redraw();
}

// iPad/Safari guard: while writing, do not let touch/gesture events scroll
// the ChatGPT page behind the iframe. This makes the widget behave like paper.
for (const type of ['touchstart', 'touchmove', 'touchend', 'gesturestart', 'gesturechange']) {
  document.addEventListener(type, (e) => {
    e.preventDefault();
    e.stopPropagation();
  }, { passive: false, capture: true });
}

// Ask ChatGPT for fullscreen when available. This gives iPad a stable writing
// surface and reduces accidental parent-page scrolling while using Apple Pencil.
async function requestWritingMode() {
  try {
    await window.openai?.requestDisplayMode?.({ mode: 'fullscreen' });
  } catch (e) {
    console.warn('Fullscreen request ignored by host:', e);
  }
}
requestWritingMode();

// ── Pointer Events (unified mouse/touch/pen) ────────────────────────────
canvas.addEventListener('pointerdown',   startStroke,    { passive: false });
canvas.addEventListener('pointermove',   continueStroke, { passive: false });
canvas.addEventListener('pointerup',     endStroke,      { passive: false });
canvas.addEventListener('pointercancel', cancelStroke,   { passive: false });
canvas.addEventListener('pointerleave',  endStroke,      { passive: false });

// Prevent context menu on long-press (mobile)
canvas.addEventListener('contextmenu', e => e.preventDefault());

// ── Rendering ────────────────────────────────────────────────────────────
function pressureToWidth(p) {
  const min = 1.5, max = 4.5;
  return min + (max - min) * Math.max(0, Math.min(1, p));
}

function drawDot(x, y, width) {
  ctx.fillStyle = '#1a1a2e';
  ctx.beginPath();
  ctx.arc(x, y, width / 2, 0, Math.PI * 2);
  ctx.fill();
}

function applyViewportTransform() {
  ctx.setTransform(
    dpr * viewportScale,
    0,
    0,
    dpr * viewportScale,
    dpr * viewportOffset.x,
    dpr * viewportOffset.y
  );
}

function clearScreen() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  applyViewportTransform();
}

function setZoom(nextScale, centerX = canvas.clientWidth / 2, centerY = canvas.clientHeight / 2) {
  const clamped = Math.max(0.5, Math.min(4, nextScale));
  const paperX = (centerX - viewportOffset.x) / viewportScale;
  const paperY = (centerY - viewportOffset.y) / viewportScale;
  viewportScale = clamped;
  viewportOffset.x = centerX - paperX * viewportScale;
  viewportOffset.y = centerY - paperY * viewportScale;
  btnZoomReset.textContent = `${Math.round(viewportScale * 100)}%`;
  redraw();
}

function drawSegment(p1, p2) {
  const w1 = pressureToWidth(p1.pressure);
  const w2 = pressureToWidth(p2.pressure);
  // Quadratic-curve-based variable-width stroke for smooth handwriting
  ctx.strokeStyle = '#1a1a2e';
  ctx.lineWidth = Math.max(w1, w2);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(p1.x, p1.y);
  ctx.lineTo(p2.x, p2.y);
  ctx.stroke();
}

function redraw() {
  clearScreen();
  if (strokes.length === 0) {
    placeholder.classList.remove('hidden');
    return;
  }
  for (const stroke of strokes) {
    if (stroke.length === 0) continue;
    if (stroke.length === 1) {
      drawDot(stroke[0].x, stroke[0].y, pressureToWidth(stroke[0].pressure));
      continue;
    }
    for (let i = 1; i < stroke.length; i++) {
      drawSegment(stroke[i - 1], stroke[i]);
    }
  }
}

// ── Controls ─────────────────────────────────────────────────────────────
btnZoomOut.addEventListener('click', () => setZoom(viewportScale / 1.25));
btnZoomIn.addEventListener('click', () => setZoom(viewportScale * 1.25));
btnZoomReset.addEventListener('click', () => {
  viewportScale = 1;
  viewportOffset = { x: 0, y: 0 };
  btnZoomReset.textContent = '100%';
  redraw();
});

btnUndo.addEventListener('click', () => {
  if (strokes.length > 0) {
    strokes.pop();
    if (strokes.length === 0) placeholder.classList.remove('hidden');
    redraw();
  }
});

btnClear.addEventListener('click', () => {
  strokes = [];
  placeholder.classList.remove('hidden');
  redraw();
});

btnSubmit.addEventListener('click', handleSubmit);

// ── Export: strokes → cropped PNG ────────────────────────────────────────
function exportToBlob() {
  if (strokes.length === 0) return null;

  // Compute bounding box with padding
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const stroke of strokes) {
    for (const p of stroke) {
      if (p.x < minX) minX = p.x;
      if (p.y < minY) minY = p.y;
      if (p.x > maxX) maxX = p.x;
      if (p.y > maxY) maxY = p.y;
    }
  }
  const pad = 24;
  minX -= pad; minY -= pad; maxX += pad; maxY += pad;
  const w = maxX - minX;
  const h = maxY - minY;

  // Create offscreen canvas at 2x for clarity
  const scale = 2;
  const off = document.createElement('canvas');
  off.width  = Math.ceil(w * scale);
  off.height = Math.ceil(h * scale);
  const octx = off.getContext('2d');
  octx.scale(scale, scale);
  octx.fillStyle = '#ffffff';
  octx.fillRect(0, 0, w, h);

  // Translate strokes so minX,minY maps to 0,0
  for (const stroke of strokes) {
    if (stroke.length === 0) continue;
    octx.strokeStyle = '#1a1a2e';
    octx.fillStyle = '#1a1a2e';
    octx.lineCap = 'round';
    octx.lineJoin = 'round';

    if (stroke.length === 1) {
      const p = stroke[0];
      const wd = pressureToWidth(p.pressure);
      octx.beginPath();
      octx.arc(p.x - minX, p.y - minY, wd / 2, 0, Math.PI * 2);
      octx.fill();
      continue;
    }

    for (let i = 1; i < stroke.length; i++) {
      const p1 = stroke[i - 1];
      const p2 = stroke[i];
      const w1 = pressureToWidth(p1.pressure);
      const w2 = pressureToWidth(p2.pressure);
      octx.lineWidth = Math.max(w1, w2);
      octx.beginPath();
      octx.moveTo(p1.x - minX, p1.y - minY);
      octx.lineTo(p2.x - minX, p2.y - minY);
      octx.stroke();
    }
  }

  return new Promise((resolve) => {
    off.toBlob(resolve, 'image/png');
  });
}

// ── MCP Apps bridge (JSON-RPC over postMessage) ──────────────────────────
let rpcId = 0;
const pendingRequests = new Map();

function rpcRequest(method, params) {
  return new Promise((resolve, reject) => {
    const id = ++rpcId;
    pendingRequests.set(id, { resolve, reject });
    window.parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
  });
}

function rpcNotify(method, params) {
  window.parent.postMessage({ jsonrpc: '2.0', method, params }, '*');
}

window.addEventListener('message', (event) => {
  if (event.source !== window.parent) return;
  const msg = event.data;
  if (!msg || msg.jsonrpc !== '2.0') return;

  // RPC response
  if (typeof msg.id === 'number' && pendingRequests.has(msg.id)) {
    const pending = pendingRequests.get(msg.id);
    pendingRequests.delete(msg.id);
    if (msg.error) pending.reject(msg.error);
    else pending.resolve(msg.result);
    return;
  }

  // Notifications from host
  if (msg.method === 'ui/notifications/tool-result') {
    // We could render any structured content here if needed
  }
}, { passive: true });

async function initBridge() {
  try {
    await rpcRequest('ui/initialize', {
      appInfo: { name: 'epaperlabs', version: '0.1.0' },
      appCapabilities: {},
      protocolVersion: '2026-01-26',
    });
    rpcNotify('ui/notifications/initialized', {});
  } catch (e) {
    console.warn('MCP Apps bridge not available — running standalone.', e);
  }
}

// Initialize bridge on load
initBridge();

// ── Submit flow ───────────────────────────────────────────────────────────
async function handleSubmit() {
  if (strokes.length === 0) {
    btnSubmit.textContent = 'Nothing to submit';
    setTimeout(() => { btnSubmit.textContent = 'Submit'; }, 1500);
    return;
  }

  overlay.classList.remove('hidden');
  btnSubmit.disabled = true;

  try {
    const blob = await exportToBlob();
    if (!blob) throw new Error('Export failed');

    // Convert blob to File
    const file = new File([blob], 'handwriting.png', { type: 'image/png' });
    const strokeCount = strokes.length;

    // ── Path A: Full ChatGPT Apps SDK flow ───────────────────────────
    // uploadFile → fileId → setWidgetState(imageIds) → sendFollowUpMessage
    // ─────────────────────────────────────────────────────────────────
    const openai = typeof window !== 'undefined' ? window.openai : undefined;

    if (openai?.uploadFile) {
      // Step 1: Upload the PNG — ChatGPT stores it and gives us a fileId
      const { fileId } = await openai.uploadFile(file, { library: true });

      // Step 2: Tell ChatGPT to make this image visible to the model
      if (openai.setWidgetState) {
        openai.setWidgetState({
          modelContent:
            'The user has submitted handwritten work from the E-PaperLabs canvas. ' +
            'The image contains their handwritten math/equations. ' +
            `It contains ${strokeCount} stroke(s). Please review the handwriting image.`,
          privateContent: { strokeCount, source: 'epaperlabs' },
          imageIds: [fileId],
        });
      }

      // Step 3: Post a follow-up message into the SAME conversation
      if (openai.sendFollowUpMessage) {
        await openai.sendFollowUpMessage({
          prompt: '[E-PaperLabs] Here is my handwritten work. Please review it.',
          scrollToBottom: true,
        });
      }

      btnSubmit.textContent = '✓ Submitted!';
      overlay.classList.add('hidden');
      setTimeout(() => {
        btnSubmit.textContent = 'Submit';
        btnSubmit.disabled = false;
      }, 3000);
      return;
    }

    // ── Path B: Standalone fallback (plain browser testing) ─────────
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'epaperlabs-handwriting.png';
    a.click();
    URL.revokeObjectURL(url);

    btnSubmit.textContent = 'Downloaded (standalone)';
    overlay.classList.add('hidden');
    setTimeout(() => {
      btnSubmit.textContent = 'Submit';
      btnSubmit.disabled = false;
    }, 2000);

  } catch (err) {
    console.error('Submit failed:', err);
    overlay.classList.add('hidden');
    btnSubmit.textContent = '✗ Error';
    btnSubmit.disabled = false;
    setTimeout(() => { btnSubmit.textContent = 'Submit'; }, 2000);
  }
}
</script>
</body>
</html>
